<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eportfolio</title>
    <link rel="stylesheet" href="https://cdn.simplecss.org/simple.min.css" />
</head>

<style>
    /* Conteneur pour aligner le mot et la zone de texte */
    .ligne {
        display: flex;
        /* Aligne horizontalement */
        align-items: center;
        /* Centre verticalement */
        gap: 20px;
        /* Espace entre le mot et la zone */
    }

    .ligne_email {
        display: flex;
        /* Aligne horizontalement */
        align-items: center;
        /* Centre verticalement */
        gap: 60px;
        /* Espace entre le mot et la zone */
    }
</style>
</head>

<Body>
    <header>
        <h1>Welcome to your ePortfolio generator</h1>
    </header>
    <h2>Personnal info</h2>
    <div class="ligne"><label for="firstname">Firstname :</label><textarea id="firstname" name="firstname" rows="1"
            cols="50"></textarea></div>
    <div class="ligne"><label for="lastname">Lastname :</label><textarea id="lastname" name="lastname" rows="1"
            cols="50"></textarea></div>
    <div class="ligne_email"><label for="email">Email:</label><textarea id="email" name="email" rows="1"
            cols="50"></textarea>
    </div>

    <h2>Project Description</h2>
</Body>




</html>
