<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ePortfolio Generator</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fafaf8;
      color: #1a1a1a;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .card {
      max-width: 700px;
      background: white;
      padding: 3rem;
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    span {
      color: #c8a96e;
    }

    p {
      font-size: 1.1rem;
      color: #666;
      line-height: 1.6;
    }

    a {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.9rem 2rem;
      background: #1a1a1a;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <section class="hero">
    <div class="card">
      <h1>Crée ton <span>ePortfolio</span></h1>
      <p>
        Une plateforme simple pour générer rapidement un portfolio professionnel
        à partir de tes informations personnelles, compétences, projets et liens.
      </p>
      <a href="/auth">Je me lance !</a>
    </div>
  </section>
</body>
</html>
