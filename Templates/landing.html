<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>ePortfolio Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #0e0d0b;
      min-height: 100vh;
    }

    .lp-root {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow: hidden;
    }

    .lp-glow {
      position: absolute;
      width: 480px;
      height: 480px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,169,110,0.12) 0%, transparent 70%);
      top: -120px;
      right: -80px;
      pointer-events: none;
    }

    .lp-glow2 {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,169,110,0.06) 0%, transparent 70%);
      bottom: -60px;
      left: -60px;
      pointer-events: none;
    }

    .lp-card {
      max-width: 580px;
      width: 100%;
      position: relative;
      z-index: 2;
      text-align: center;
      animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .lp-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #c8a96e;
      border: 0.5px solid rgba(200,169,110,0.35);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 2rem;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.6rem, 6vw, 3.6rem);
      font-weight: 400;
      line-height: 1.1;
      color: #f5f2ec;
      margin: 0 0 0.3rem;
      letter-spacing: -0.02em;
      animation: fadeUp 0.8s 0.15s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-title em {
      font-style: italic;
      color: #c8a96e;
    }

    .lp-line {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c8a96e, transparent);
      margin: 1.5rem auto;
      animation: fadeUp 0.8s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-desc {
      font-size: 1rem;
      font-weight: 300;
      color: rgba(245,242,236,0.55);
      line-height: 1.7;
      max-width: 420px;
      margin: 0 auto 2.5rem;
      animation: fadeUp 0.8s 0.25s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-actions {
      display: flex;
      justify-content: center;
      animation: fadeUp 0.8s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0.75rem 1.75rem;
      background: #c8a96e;
      color: #0e0d0b;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.9rem;
      text-decoration: none;
      border-radius: 8px;
      letter-spacing: 0.01em;
      transition: background 0.2s, transform 0.15s;
    }

    .lp-btn-primary:hover {
      background: #d9bc84;
      transform: translateY(-1px);
    }

    .lp-btn-primary:active {
      transform: translateY(0) scale(0.98);
    }

    .lp-features {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 3rem;
      animation: fadeUp 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .lp-feat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 400;
      color: rgba(245,242,236,0.35);
      letter-spacing: 0.02em;
    }

    .lp-feat i {
      font-size: 14px;
      color: rgba(200,169,110,0.5);
    }
  </style>
</head>
<body>
  <section class="lp-root">
    <div class="lp-glow"></div>
    <div class="lp-glow2"></div>

    <div class="lp-card">
      <div class="lp-badge">ePortfolio Generator</div>

      <h1 class="lp-title">Crée ton<br><em>portfolio</em> en minutes</h1>

      <div class="lp-line"></div>

      <p class="lp-desc">
        Génère un portfolio professionnel à partir de tes infos, compétences, projets et liens — sans ligne de code.
      </p>

      <div class="lp-actions">
        <a href="/auth" class="lp-btn-primary">
          Je me lance
          <i class="ti ti-arrow-right" aria-hidden="true"></i>
        </a>
      </div>

      <div class="lp-features">
        <span class="lp-feat"><i class="ti ti-bolt" aria-hidden="true"></i> Rapide</span>
        <span class="lp-feat"><i class="ti ti-lock" aria-hidden="true"></i> Sécurisé</span>
        <span class="lp-feat"><i class="ti ti-sparkles" aria-hidden="true"></i> Professionnel</span>
      </div>
    </div>
  </section>
</body>
</html>
