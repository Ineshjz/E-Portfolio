<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <title>Connexion — Eportfolio Generator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,500&family=Inter:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(ellipse at 70% 40%, #2a200a 0%, #0d0d0b 60%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
      font-family: 'Inter', sans-serif;
    }

    .auth-badge {
      border: 1px solid #c9a84c55;
      border-radius: 999px;
      padding: 5px 18px;
      font-size: 11px;
      letter-spacing: 0.12em;
      color: #c9a84c;
      margin-bottom: 1.8rem;
      text-transform: uppercase;
    }

    .auth-heading {
      font-family: 'Playfair Display', serif;
      font-size: clamp(22px, 4vw, 36px);
      font-weight: 700;
      color: #f5f0e8;
      text-align: center;
      margin-bottom: 0.2rem;
      line-height: 1.2;
    }

    .auth-heading em {
      font-style: italic;
      color: #c9a84c;
      font-weight: 500;
    }

    .auth-divider {
      width: 40px;
      height: 1px;
      background: #c9a84c66;
      margin: 1rem auto 2rem;
    }

    .auth-cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .auth-card {
      background: #161410;
      border: 0.5px solid #c9a84c33;
      border-radius: 16px;
      padding: 2rem 1.75rem;
      width: 300px;
      position: relative;
      overflow: hidden;
    }

    .auth-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a84c66, transparent);
    }

    .auth-card h2 {
      font-family: 'Playfair Display', serif;
      font-size: 20px;
      font-weight: 700;
      color: #f5f0e8;
      margin: 0 0 1.5rem;
    }

    .auth-card label {
      display: block;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #c9a84c;
      margin-bottom: 6px;
    }

    .auth-card input {
      width: 100%;
      background: #0d0d0b;
      border: 0.5px solid #c9a84c44;
      border-radius: 8px;
      padding: 0.7rem 0.9rem;
      margin-bottom: 1.1rem;
      color: #f5f0e8;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .auth-card input::placeholder {
      color: #555;
    }

    .auth-card input:focus {
      border-color: #c9a84c99;
    }

    .auth-card small {
      display: block;
      font-size: 12px;
      color: #6b6555;
      margin-bottom: 1.2rem;
      line-height: 1.5;
    }

    .auth-card small strong {
      color: #c9a84c;
      font-weight: 500;
    }

    .auth-btn {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #c9a84c;
      color: #0d0d0b;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .auth-btn:hover {
      background: #dbb95a;
    }

    .auth-btn:active {
      transform: scale(0.98);
    }

    .auth-footer {
      display: flex;
      gap: 1.5rem;
      margin-top: 2rem;
      color: #4a4535;
      font-size: 12px;
    }

    .auth-footer span {
      display: flex;
      align-items: center;
      gap: 5px;
    }
  </style>
</head>

<body>

  <div class="auth-badge">Eportfolio Generator</div>
  <div class="auth-heading">Ton <em>portfolio</em> commence ici</div>
  <div class="auth-divider"></div>

  <div class="auth-cards">

    <form class="auth-card" action="/register" method="post">
      <h2>Créer un compte</h2>
      <label for="reg-email">Adresse email</label>
      <input id="reg-email" type="email" name="email" placeholder="adresse@email.com" required
        pattern="^[^\s@]+@[^\s@]+\.[^\s@]+$" title="Entre une adresse email valide">
      <label for="reg-password">Mot de passe</label>
      <input id="reg-password" type="password" name="password" placeholder="••••••••" required>
      <small>Le compte créé aura automatiquement le rôle <strong>user</strong>.</small>
      <button class="auth-btn" type="submit">
        Créer mon compte <i class="ti ti-arrow-right"></i>
      </button>
    </form>

    <form class="auth-card" action="/login" method="post">
      <h2>Connexion</h2>
      <label for="login-email">Adresse email</label>
      <input id="login-email" type="email" name="email" placeholder="adresse@email.com" required>
      <label for="login-password">Mot de passe</label>
      <input id="login-password" type="password" name="password" placeholder="••••••••" required>
      <button class="auth-btn" type="submit" style="margin-top: 2.45rem;">
        Se connecter <i class="ti ti-arrow-right"></i>
      </button>
    </form>

  </div>

  <div class="auth-footer">
    <span><i class="ti ti-bolt"></i> Rapide</span>
    <span><i class="ti ti-sparkles"></i> Professionnel</span>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error') === 'invalid') {
      const msg = document.createElement('div');
      msg.textContent = 'Email ou mot de passe incorrect.';
      msg.style.cssText = 'color:#c0392b;text-align:center;margin-top:1rem;font-size:14px;';
      document.querySelector('.auth-cards').after(msg);
    }
  </script>

</body>

</html>
